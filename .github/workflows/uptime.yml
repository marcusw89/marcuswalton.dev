# Checks every 30 minutes that the site is up. A failed run means the site
# was down or broken; GitHub emails the repo owner about failed scheduled runs.
name: Uptime check

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check pages and redirect
        run: |
          set -u
          fail=0

          check() {
            local url="$1" want="$2"
            local got
            got=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 10 --retry-all-errors --max-time 20 "$url" || echo 000)
            if [ "$got" = "$want" ]; then
              echo "OK    $got  $url"
            else
              echo "FAIL  $got (expected $want)  $url"
              # Show who answered and whether Cloudflare challenged the request.
              curl -sI --max-time 20 "$url" | grep -iE '^(server|cf-mitigated|cf-ray|location):' | sed 's/^/      /'
              fail=1
            fi
          }

          check https://marcuswalton.dev/ 200
          check https://marcuswalton.dev/work/memset-migration 200
          check https://marcuswalton.dev/assets/Marcus-Walton-CV.pdf 200
          check https://www.marcuswalton.dev/ 301

          # The page should contain real content, not an error page.
          curl -s --max-time 20 https://marcuswalton.dev/ | grep -q "Marcus Walton" || { echo "FAIL  homepage content missing"; fail=1; }

          exit $fail
